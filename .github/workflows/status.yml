# status.hasteclip.com (status/, a Cloudflare Worker): every push and pull
# request that changes it is type-checked; pushes to main then apply its D1
# migrations and deploy it. That needs the CLOUDFLARE_API_TOKEN secret (Workers
# Scripts, D1 and Workers Routes, for hasteclip.com only) and the
# CLOUDFLARE_ACCOUNT_ID variable; without them it only checks.

name: Status page

on:
  push:
    branches: [main]
    paths: ["status/**", ".github/workflows/status.yml"]
  pull_request:
    paths: ["status/**", ".github/workflows/status.yml"]

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: status
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: status/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Deploy
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "No CLOUDFLARE_API_TOKEN secret or CLOUDFLARE_ACCOUNT_ID variable: checked, not deploying."
            exit 0
          fi
          npx wrangler d1 migrations apply hasteclip-status --remote
          npx wrangler deploy
