[package]
name = "hasteclip-api"
version = "0.1.0"
edition = "2024"
description = "Share links for HasteClip clips"
license = "AGPL-3.0-or-later"
repository = "https://github.com/hasteclip/api"
publish = false

[dependencies]
askama = "0.16.1"
axum = { version = "0.8.9", features = ["macros", "form"] }
base64 = "0.22"
governor = { version = "0.10", default-features = false, features = ["std"] }
jiff = "0.2"
md-5 = "0.11"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rusty-s3 = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "time"] }
time = { version = "0.3.55", features = ["serde", "formatting", "macros"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.7.1", features = ["set-header", "limit", "trace"] }
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[profile.release]
lto = "thin"
codegen-units = 1
